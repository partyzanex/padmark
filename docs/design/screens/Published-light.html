<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Padmark — Note published (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap">
<style>
body{margin:0}
.pm{--bg:#F3F4F6;--surface:#FFFFFF;--sunken:#F7F8FA;--ink:#14151A;--ink-2:#3B3E48;--muted:#5D6170;--line:#E2E4EA;--line-2:#CDD0D8;--accent:#4A3AE0;--on-accent:#FFFFFF;--accent-soft:#ECEAFF;--accent-text:#3A2BC4;--warn:#9A4A06;--warn-soft:#FFF1E0;--code-bg:#F0F1F4;--shadow:0 1px 2px rgba(20,21,26,.05),0 10px 30px -14px rgba(20,21,26,.14);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.pm.dim{--bg:#26272F;--surface:#2F3039;--sunken:#2A2B33;--ink:#ECEDF2;--ink-2:#CDCFD8;--muted:#A9ACB8;--line:#3D3F4A;--line-2:#4F525E;--accent:#9C92FF;--on-accent:#14151A;--accent-soft:#37335C;--accent-text:#BDB6FF;--warn:#F2A766;--warn-soft:#43321F;--code-bg:#353640;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.6)}
.pm.dark{--bg:#0A0B0E;--surface:#121318;--sunken:#0E0F13;--ink:#EDEEF2;--ink-2:#C4C6CF;--muted:#9295A2;--line:#22242C;--line-2:#30323C;--accent:#8E83FF;--on-accent:#0A0B0E;--accent-soft:#1E1B3A;--accent-text:#ADA5FF;--warn:#F2A766;--warn-soft:#2D2116;--code-bg:#1A1B22;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.8)}
.pm *{box-sizing:border-box}
.pm input,.pm textarea,.pm select,.pm button{font:inherit;color:inherit}
.pm button{cursor:pointer}
.pm a{color:var(--accent-text);text-decoration:none}
.pm a:hover{color:var(--ink)}
.pm ::placeholder{color:var(--muted)}
.pm .nav:hover{color:var(--ink);background:var(--sunken)}
.pm .ghost:hover{background:var(--sunken);color:var(--ink)}
.pm .primary:hover{filter:brightness(1.08)}
.pm .field{transition:border-color .15s,box-shadow .15s}
.pm .field:focus,.pm .field:focus-within{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pm button:focus-visible,.pm a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pm .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pm .kbd{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;padding:2px 6px;border-radius:5px;border:1px solid currentColor;opacity:.85}
.pm .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="pm {{theme}}" style="min-height: 100vh">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px)">

<header style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 16px 0">
<a href="Main.dc.html" aria-label="Padmark — home" style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em; color: var(--ink); line-height: 1">Padmark<span style="color: var(--accent)">.</span></a>
<div style="flex: 1"></div>
<nav aria-label="Resources" style="display: flex; gap: 2px; align-items: center">
<a class="nav" href="#api" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; font-size: 13px; color: var(--muted)">API</a>
<a class="nav" href="https://github.com" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; font-size: 13px; color: var(--muted)">GitHub</a>
</nav>
<div role="group" aria-label="Theme" style="display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken)">
<button type="button" aria-label="Light theme" aria-pressed="{{pL}}" onClick="{{setL}}" style="width: 32px; height: 32px; border: 0; border-radius: 999px; display: grid; place-items: center; {{tL}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
<button type="button" aria-label="Dim theme" aria-pressed="{{pD}}" onClick="{{setD}}" style="width: 32px; height: 32px; border: 0; border-radius: 999px; display: grid; place-items: center; {{tD}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"></path></svg></button>
<button type="button" aria-label="Dark theme" aria-pressed="{{pK}}" onClick="{{setK}}" style="width: 32px; height: 32px; border: 0; border-radius: 999px; display: grid; place-items: center; {{tK}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></button>
</div>
<a class="primary" href="Main.dc.html" style="height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 9px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New</a>
</header>

<main style="display: flex; justify-content: center; padding: 40px 0 64px">
<section aria-labelledby="pm-pub-h" style="width: 100%; max-width: 660px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: clamp(20px, 3.5vw, 36px); display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 14px; align-items: flex-start">
<span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
<h1 id="pm-pub-h" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 32px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15">Your note is live</h1>
<p style="margin: 0; font-size: 14px; color: var(--muted)">“Чек-лист перед релизом” — anyone with the link can read it.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<label for="pm-share" class="lbl">Share link</label>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<div class="field" style="flex: 1 1 280px; min-width: 0; display: flex; align-items: center; height: 44px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--sunken)">
<input id="pm-share" readonly value="[your-host]/checklist" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; color: var(--ink)">
</div>
<button class="primary" type="button" onClick="{{copy}}" style="height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>{{copyLabel}}</button>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<a class="ghost" href="Note.dc.html" style="height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); color: var(--ink); font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>Open note</a>
<a class="ghost" href="#raw" style="height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); color: var(--ink); font-size: 13px; font-weight: 500"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="m10 13-2 2 2 2M14 13l2 2-2 2"></path></svg>Raw</a>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 10px; background: var(--warn-soft); color: var(--ink)">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--warn)"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 9-9M17 6l3 3M15 8l2 2"></path></svg>
<h2 style="margin: 0; font-size: 14px; font-weight: 600">Edit code</h2>
</div>
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
<code style="flex: 1 1 200px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 17px; letter-spacing: .12em; font-weight: 600; padding: 10px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line)">{{code}}</code>
<button class="ghost" type="button" onClick="{{toggleReveal}}" aria-pressed="{{revealStr}}" style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 500">{{revealLabel}}</button>
<button class="ghost" type="button" aria-label="Copy edit code" style="width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></button>
</div>
<p style="margin: 0; font-size: 13px; color: var(--ink-2)">Save it now — you'll need it to edit or delete this note.</p>
</div>

<ul aria-label="Note settings" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
<li style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>Public</li>
<li style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Expires in 90 days</li>
<li style="display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-2.7 7-7 0-4-3-6.5-4.5-9.5C13 7 12.5 9 11 10 10.5 8 9.5 6.5 8 5c0 3-3 5.5-3 10 0 4.3 3 7 7 7z"></path></svg>Doesn't burn</li>
</ul>

<div style="display: flex; gap: 20px; flex-wrap: wrap; padding-top: 20px; border-top: 1px solid var(--line); font-size: 13px; font-weight: 500">
<a href="Main.dc.html">Write another note</a>
<a href="Link.dc.html">Shorten a link</a>
</div>
</section>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dim","dark"],"default":"light"},"$preview":{"width":1440,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'light';
    const reveal = !!s.reveal;
    const seg = (on) => on
      ? 'background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14)'
      : 'background: transparent; color: var(--muted)';
    return {
      theme,
      tL: seg(theme === 'light'), tD: seg(theme === 'dim'), tK: seg(theme === 'dark'),
      pL: String(theme === 'light'), pD: String(theme === 'dim'), pK: String(theme === 'dark'),
      setL: () => this.setState({ theme: 'light' }),
      setD: () => this.setState({ theme: 'dim' }),
      setK: () => this.setState({ theme: 'dark' }),
      copyLabel: s.copied ? 'Copied' : 'Copy link',
      copy: () => this.setState({ copied: true }),
      code: reveal ? '7QF2-K9XM-4TDA' : '••••-••••-••••',
      revealStr: String(reveal),
      revealLabel: reveal ? 'Hide' : 'Show',
      toggleReveal: () => this.setState({ reveal: !reveal })
    };
  }
}
</script>
</body>
</html>
