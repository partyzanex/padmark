<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Padmark — Sign in (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap">
<style>
body{margin:0}
.pm{--bg:#F3F4F6;--surface:#FFFFFF;--sunken:#F7F8FA;--ink:#14151A;--ink-2:#3B3E48;--muted:#5D6170;--line:#E2E4EA;--line-2:#CDD0D8;--accent:#4A3AE0;--on-accent:#FFFFFF;--accent-soft:#ECEAFF;--accent-text:#3A2BC4;--warn:#9A4A06;--warn-soft:#FFF1E0;--code-bg:#F0F1F4;--shadow:0 1px 2px rgba(20,21,26,.05),0 10px 30px -14px rgba(20,21,26,.14);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.pm.dim{--bg:#26272F;--surface:#2F3039;--sunken:#2A2B33;--ink:#ECEDF2;--ink-2:#CDCFD8;--muted:#A9ACB8;--line:#3D3F4A;--line-2:#4F525E;--accent:#9C92FF;--on-accent:#14151A;--accent-soft:#37335C;--accent-text:#BDB6FF;--warn:#F2A766;--warn-soft:#43321F;--code-bg:#353640;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.6)}
.pm.dark{--bg:#0A0B0E;--surface:#121318;--sunken:#0E0F13;--ink:#EDEEF2;--ink-2:#C4C6CF;--muted:#9295A2;--line:#22242C;--line-2:#30323C;--accent:#8E83FF;--on-accent:#0A0B0E;--accent-soft:#1E1B3A;--accent-text:#ADA5FF;--warn:#F2A766;--warn-soft:#2D2116;--code-bg:#1A1B22;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.8)}
.pm *{box-sizing:border-box}
.pm input,.pm textarea,.pm select,.pm button{font:inherit;color:inherit}
.pm button{cursor:pointer}
.pm a{color:var(--accent-text);text-decoration:none}
.pm a:hover{color:var(--ink)}
.pm ::placeholder{color:var(--muted)}
.pm .nav:hover{color:var(--ink);background:var(--sunken)}
.pm .ghost:hover{background:var(--sunken);color:var(--ink)}
.pm .primary:hover{filter:brightness(1.08)}
.pm .field{transition:border-color .15s,box-shadow .15s}
.pm .field:focus,.pm .field:focus-within{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pm button:focus-visible,.pm a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pm .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>
</helmet>
<div class="pm {{theme}}" style="min-height: 100vh; display: flex; flex-direction: column">
<div style="width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px)">
<header style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 16px 0">
<a href="Main.dc.html" aria-label="Padmark — home" style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em; color: var(--ink); line-height: 1">Padmark<span style="color: var(--accent)">.</span></a>
<nav aria-label="Create" style="display: flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 9px">
<a class="nav" href="Main.dc.html" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M9 13h6M9 17h4"></path></svg>Note</a>
<a class="nav" href="Link.dc.html" style="display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 500; color: var(--muted)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11.5 4.5"></path><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.33-1.4"></path></svg>Short link</a>
</nav>
<div style="flex: 1"></div>
<nav aria-label="Resources" style="display: flex; gap: 2px; align-items: center">
<a class="nav" href="#api" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; font-size: 13px; color: var(--muted)">API</a>
<a class="nav" href="https://github.com" style="height: 36px; display: flex; align-items: center; padding: 0 12px; border-radius: 8px; font-size: 13px; color: var(--muted)">GitHub</a>
</nav>
<div role="group" aria-label="Theme" style="display: flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--sunken)">
<button type="button" aria-label="Light theme" aria-pressed="{{pL}}" onClick="{{setL}}" style="width: 32px; height: 32px; border: 0; border-radius: 999px; display: grid; place-items: center; {{tL}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
<button type="button" aria-label="Dim theme" aria-pressed="{{pD}}" onClick="{{setD}}" style="width: 32px; height: 32px; border: 0; border-radius: 999px; display: grid; place-items: center; {{tD}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"></path></svg></button>
<button type="button" aria-label="Dark theme" aria-pressed="{{pK}}" onClick="{{setK}}" style="width: 32px; height: 32px; border: 0; border-radius: 999px; display: grid; place-items: center; {{tK}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></button>
</div>
<a href="SignIn-light.dc.html" aria-current="page" style="height: 38px; display: flex; align-items: center; padding: 0 14px; border-radius: 9px; border: 1px solid var(--accent); background: var(--accent-soft); font-size: 13px; font-weight: 600; color: var(--accent-text)">Sign in</a>
</header>
</div>

<main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px 64px">
<form aria-labelledby="pm-signin-h" style="width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: clamp(20px, 4vw, 28px); display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text); margin-bottom: 6px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"></path><path d="m9 12 2 2 4-4" stroke-linecap="round"></path></svg></span>
<h1 id="pm-signin-h" style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -0.015em">Sign in</h1>
<p style="margin: 0; font-size: 14px; color: var(--muted); line-height: 1.5">Your username, password and the 6-digit code from your authenticator app.</p>
</div>

<sc-if value="{{err}}" hint-placeholder-val="{{ true }}">
<div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); font-size: 13px; line-height: 1.45">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="color: var(--warn); flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.01"></path></svg>
<span><strong style="font-weight: 600">That didn't work.</strong> Check all three fields — the code changes every 30 seconds.</span>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pm-user" class="lbl">Username</label>
<input id="pm-user" class="field" autocomplete="username" placeholder="Your username" style="height: 40px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--sunken); font-size: 14px">
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pm-pass" class="lbl">Password</label>
<div class="field" style="display: flex; align-items: center; height: 40px; padding: 0 4px 0 14px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--sunken)">
<input id="pm-pass" type="{{passType}}" autocomplete="current-password" placeholder="Your password" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; height: 100%; font-size: 14px">
<button class="ghost" type="button" aria-label="{{passLabel}}" aria-pressed="{{showStr}}" onClick="{{togglePass}}" style="width: 38px; height: 38px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="pm-totp" class="lbl">Authenticator code</label>
<input id="pm-totp" class="field" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" style="height: 48px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 9px; background: var(--sunken); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 24px; font-weight: 600; letter-spacing: .5em; text-align: center">
</div>

<button class="primary" type="button" onClick="{{submit}}" style="height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px">Sign in<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>

<p style="margin: 0; text-align: center; font-size: 13px; color: var(--muted)">No account? Ask an admin for an invite. · <a href="Main.dc.html">Back to Padmark</a></p>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dim","dark"],"default":"light"},"showError":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const theme = s.theme || this.props.theme || 'light';
    const show = !!s.show;
    const err = s.err != null ? s.err : (this.props.showError ?? true);
    const seg = (on) => on
      ? 'background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.14)'
      : 'background: transparent; color: var(--muted)';
    return {
      theme,
      tL: seg(theme === 'light'), tD: seg(theme === 'dim'), tK: seg(theme === 'dark'),
      pL: String(theme === 'light'), pD: String(theme === 'dim'), pK: String(theme === 'dark'),
      setL: () => this.setState({ theme: 'light' }),
      setD: () => this.setState({ theme: 'dim' }),
      setK: () => this.setState({ theme: 'dark' }),
      err,
      submit: () => this.setState({ err: true }),
      passType: show ? 'text' : 'password',
      passLabel: show ? 'Hide password' : 'Show password',
      showStr: String(show),
      togglePass: () => this.setState({ show: !show })
    };
  }
}
</script>
</body>
</html>
