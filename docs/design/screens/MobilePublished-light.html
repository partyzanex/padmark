<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Padmark mobile — Note published (light)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap">
<style>
body{margin:0}
.pm{--bg:#F3F4F6;--surface:#FFFFFF;--sunken:#F7F8FA;--ink:#14151A;--ink-2:#3B3E48;--muted:#5D6170;--line:#E2E4EA;--line-2:#CDD0D8;--accent:#4A3AE0;--on-accent:#FFFFFF;--accent-soft:#ECEAFF;--accent-text:#3A2BC4;--warn:#9A4A06;--warn-soft:#FFF1E0;--code-bg:#F0F1F4;--shadow:0 1px 2px rgba(20,21,26,.05),0 10px 30px -14px rgba(20,21,26,.14);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
.pm.dim{--bg:#26272F;--surface:#2F3039;--sunken:#2A2B33;--ink:#ECEDF2;--ink-2:#CDCFD8;--muted:#A9ACB8;--line:#3D3F4A;--line-2:#4F525E;--accent:#9C92FF;--on-accent:#14151A;--accent-soft:#37335C;--accent-text:#BDB6FF;--warn:#F2A766;--warn-soft:#43321F;--code-bg:#353640;--shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -16px rgba(0,0,0,.6)}
.pm.dark{--bg:#0A0B0E;--surface:#121318;--sunken:#0E0F13;--ink:#EDEEF2;--ink-2:#C4C6CF;--muted:#9295A2;--line:#22242C;--line-2:#30323C;--accent:#8E83FF;--on-accent:#0A0B0E;--accent-soft:#1E1B3A;--accent-text:#ADA5FF;--warn:#F2A766;--warn-soft:#2D2116;--code-bg:#1A1B22;--shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.8)}
.pm *{box-sizing:border-box}
.pm input,.pm textarea,.pm select,.pm button{font:inherit;color:inherit}
.pm button{cursor:pointer}
.pm a{color:var(--accent-text);text-decoration:none}
.pm button:focus-visible,.pm a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pm .lbl{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>
</helmet>
<div class="pm {{theme}}" style="width: 390px; height: 900px; position: relative; overflow: hidden; display: flex; flex-direction: column">

<header style="display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 8px 0 18px; background: var(--surface); border-bottom: 1px solid var(--line); flex: none">
<a href="MobileEditor.dc.html" aria-label="Padmark — home" style="font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 20px; letter-spacing: -0.02em; color: var(--ink); line-height: 1">Padmark<span style="color: var(--accent)">.</span></a>
<div style="flex: 1"></div>
<button type="button" aria-label="{{themeLabel}}" onClick="{{cycleTheme}}" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"></path></svg></button>
<button type="button" aria-label="Menu" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--ink-2); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
</header>

<main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 28px 16px 28px">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 4px">
<span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent-text)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
<h1 style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 28px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15">Your note is live</h1>
<p style="margin: 0; font-size: 14px; color: var(--muted); line-height: 1.45">“Чек-лист перед релизом” — anyone with the link can read it.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<label for="m-share" class="lbl" style="padding: 0 4px">Share link</label>
<input id="m-share" readonly value="[your-host]/checklist" style="height: 48px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--sunken); font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; outline: none">
<button type="button" onClick="{{copy}}" style="height: 48px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg>{{copyLabel}}</button>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>Share</button>
<a href="MobileNote.dc.html" style="height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>Open</a>
<a href="#raw" style="height: 48px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 500"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 8-4 4 4 4M16 8l4 4-4 4"></path></svg>Raw</a>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 12px; background: var(--warn-soft)">
<div style="display: flex; align-items: center; gap: 10px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--warn)"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 9-9M17 6l3 3M15 8l2 2"></path></svg>
<h2 style="margin: 0; font-size: 14px; font-weight: 600">Edit code</h2>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<code style="flex: 1; min-width: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; letter-spacing: .1em; font-weight: 600; padding: 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; overflow: hidden">{{code}}</code>
<button type="button" onClick="{{toggleReveal}}" aria-pressed="{{revealStr}}" style="height: 46px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 500">{{revealLabel}}</button>
</div>
<p style="margin: 0; font-size: 13px; color: var(--ink-2); line-height: 1.45">Save it now — you'll need it to edit or delete this note.</p>
</div>

<ul aria-label="Note settings" style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
<li style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2)">Public</li>
<li style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2)">Expires in 90 days</li>
<li style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--ink-2)">Contents on</li>
</ul>

<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<a href="MobileEditor.dc.html" style="height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: var(--accent-soft)">New note</a>
<a href="MobileLink.dc.html" style="height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: var(--accent-soft)">Short link</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dim","dark"],"default":"light"},"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const order = ['light', 'dim', 'dark'];
    const theme = s.theme || this.props.theme || 'light';
    const reveal = !!s.reveal;
    return {
      theme,
      themeLabel: 'Theme: ' + theme + ' (tap to change)',
      cycleTheme: () => this.setState({ theme: order[(order.indexOf(theme) + 1) % 3] }),
      copyLabel: s.copied ? 'Copied' : 'Copy link',
      copy: () => this.setState({ copied: true }),
      code: reveal ? '7QF2-K9XM-4TDA' : '••••-••••-••••',
      revealStr: String(reveal),
      revealLabel: reveal ? 'Hide' : 'Show',
      toggleReveal: () => this.setState({ reveal: !reveal })
    };
  }
}
</script>
</body>
</html>
