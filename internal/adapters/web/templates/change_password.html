<!DOCTYPE html>
<html lang="en" data-theme="dim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padmark — Change Password</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css?p={{styleVersion}}">
</head>
<body>
<div class="wrapper">

    {{template "header" ""}}

    <main class="login-center">
        <div class="card login-card">
            <div class="login-head">
                <span class="login-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/></svg></span>
                <h1 class="login-title">Change password</h1>
                <p class="login-desc">Min 12 chars — upper, lower, digit, special character required.</p>
            </div>

            {{if .Error}}
            <div class="login-error" role="alert">{{.Error}}</div>
            {{end}}

            {{if .Success}}
            <div class="login-success" role="status">Password changed successfully.</div>
            {{end}}

            <form method="POST" action="/change-password">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                <div class="field-group">
                    <label class="field-label" for="old_password">Current password</label>
                    <input type="password" class="field-input" name="old_password" id="old_password"
                           placeholder="Current password" autofocus required autocomplete="current-password">
                </div>
                <div class="field-group">
                    <label class="field-label" for="new_password">New password</label>
                    <input type="password" class="field-input" name="new_password" id="new_password"
                           placeholder="New password" required autocomplete="new-password">
                </div>
                <div class="field-group">
                    <label class="field-label" for="new_password_confirm">Confirm new password</label>
                    <input type="password" class="field-input" name="new_password_confirm" id="new_password_confirm"
                           placeholder="Repeat new password" required autocomplete="new-password">
                </div>
                <div class="field-group">
                    <label class="field-label" for="totp_code">Authenticator code</label>
                    <input type="text" class="field-input field-input--code" name="totp_code" id="totp_code"
                           placeholder="000000" required autocomplete="one-time-code"
                           inputmode="numeric" pattern="[0-9]{6}" maxlength="6">
                </div>
                <button type="submit" class="btn-publish">Change password</button>
            </form>

            {{template "signout" .}}
        </div>
    </main>

</div>

<script nonce="{{.Nonce}}">
    {{template "theme-js"}}
</script>
<script src="/static/password-toggle.js" defer></script>
</body>
</html>
