<!DOCTYPE html>
<html lang="en" data-theme="dim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padmark — Login</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css?p={{styleVersion}}">
</head>
<body>
<div class="wrapper">

    {{template "header" ""}}

    <main class="login-center">
        <div class="card login-card">
            <div class="login-head">
                <span class="login-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></span>
                <h1 class="login-title">Sign in</h1>
                <p class="login-desc">Your username, password and the 6-digit code from your authenticator app.</p>
            </div>

            {{if .Error}}
            <div class="login-error" role="alert">Invalid credentials. Please try again.</div>
            {{end}}

            <form method="POST" action="/totp-login">
                <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                {{if .Next}}<input type="hidden" name="next" value="{{.Next}}">{{end}}
                <div class="field-group">
                    <label class="field-label" for="username">Username</label>
                    <input type="text" class="field-input" name="username" id="username"
                           placeholder="Your username" autofocus required autocomplete="username">
                </div>
                <div class="field-group">
                    <label class="field-label" for="password">Password</label>
                    <input type="password" class="field-input" name="password" id="password"
                           placeholder="Your password" required autocomplete="current-password">
                </div>
                <div class="field-group">
                    <label class="field-label" for="code">Authenticator code</label>
                    <input type="text" class="field-input field-input--code" name="code" id="code"
                           placeholder="000000" inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                           required autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn-publish">Sign in</button>
            </form>
            <p class="login-foot">No account? Ask an admin for an invite. · <a href="/">Back to Padmark</a></p>
        </div>
    </main>

</div>

<script nonce="{{.Nonce}}">
    {{template "theme-js"}}
</script>
<script src="/static/password-toggle.js" defer></script>
</body>
</html>
