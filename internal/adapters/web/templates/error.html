<!DOCTYPE html>
<html lang="en" data-theme="dim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padmark — {{.Code}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css?p={{styleVersion}}">
</head>
<body>
<div class="wrapper">

    {{template "header" ""}}

    <main class="center-main">
        <section class="card error-content" data-type="{{.ErrorType}}" aria-labelledby="errorTitle">
            <span class="error-code">{{.Code}}</span>
            <h1 class="error-title" id="errorTitle">{{.Title}}</h1>
            <p class="error-desc">{{.Desc}}</p>

            <div class="error-actions">
                <a href="/" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    Create new paste
                </a>
                <a href="/" class="btn-ghost">Home</a>
            </div>

            {{if .Detail}}
            <div class="error-detail">
                <span class="lbl">Details</span>
                <span class="error-detail-text">{{.Detail}}</span>
            </div>
            {{end}}
        </section>
    </main>

    {{template "footer"}}

</div>

<script nonce="{{.Nonce}}">
    {{template "theme-js"}}
</script>
</body>
</html>
