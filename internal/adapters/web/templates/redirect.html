<!DOCTYPE html>
<html lang="en" data-theme="dim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta refresh navigates without any script — html/template context-filters the URL in
         this attribute (a javascript:/data: target degenerates to a dead link, it cannot run).
         The 5-second delay is the point of the interstitial: it gives the visitor time to read
         the destination before being sent there (links with direct_redirect=false). -->
    <meta http-equiv="refresh" content="5;url={{.TargetURL}}">
    <title>Padmark — Redirecting…</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css?p={{styleVersion}}">
</head>
<body>
<div class="wrapper">

    {{template "header" ""}}

    <main class="center-main">
        <section class="card success-card" aria-labelledby="redirectTitle">
            <div class="success-head">
                <span class="success-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
                </span>
                <h1 class="success-title" id="redirectTitle">Redirecting…</h1>
                <p class="success-subtitle">You're being sent to an external site.</p>
            </div>

            <div class="share-block">
                <span class="lbl">Destination</span>
                <div class="copy-field">
                    <a href="{{.TargetURL}}" class="copy-value">{{.TargetURL}}</a>
                </div>
            </div>

            <div class="secret-block">
                <div class="secret-head">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>
                    <h2>Check the destination</h2>
                </div>
                <p class="secret-note">Only continue if you recognize and trust this destination.</p>
                <noscript><p class="secret-note">If you are not redirected automatically in a few seconds, use the Continue link below.</p></noscript>
            </div>

            <div class="action-row">
                <a href="{{.TargetURL}}" class="btn-primary" id="continueLink">
                    Continue
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </a>
                <a href="/" class="btn-ghost">Home</a>
            </div>
        </section>
    </main>

</div>

<script nonce="{{.Nonce}}">
    {{template "theme-js"}}
</script>
</body>
</html>
