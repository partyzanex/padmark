name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  DOCKER_IMAGE: ${{ vars.DOCKER_IMAGE || 'partyzanex/padmark' }}

jobs:
  prepare:
    name: Prepare Go cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Warm module & build cache
        run: go build ./...

  lint:
    name: Lint
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      # tests/ui is a separate Go module outside the root ./..., so it is linted on its own,
      # with the same pinned version and the root configuration.
      - name: Lint browser UI tests
        uses: golangci/golangci-lint-action@v7
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: tests/ui
          args: --config ../../.golangci.yml

  test:
    name: Test
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests
        run: go test -v -count=1 -race ./... -coverprofile=cover.out

      # The render timing tests skip under -race with coverage, and the 4 MiB case skips under
      # any -race. Run them here without both, so the render budget guards stay active in CI.
      - name: Render timing tests
        run: >-
          go test -v -count=1
          -run '^TestRender(SuperLinearInputsWithinBudget|LinearWorstCaseAtMaxSize)$'
          ./internal/infra/render

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: cover.out

  integration:
    name: Integration tests
    needs: [prepare]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The tests/ tree, the PostgreSQL repository tests and the S3 adapter tests are gated by
      # //go:build integration. Run them here so Docker-backed adapters stay covered outside the
      # unit job. Docker is available on ubuntu-latest for the testcontainers suites.
      - name: Integration tests
        run: >-
          go test -v -count=1 -race -tags=integration
          ./tests/...
          ./internal/infra/storage/postgres
          ./internal/infra/storage/s3store

  compose:
    name: Compose configuration
    runs-on: ubuntu-latest
    # Dummy values only: this job renders the file and starts no container.
    env:
      POSTGRES_PASSWORD: ci-dummy
      PADMARK_S3_ACCESS_KEY: ci-dummy
      PADMARK_S3_SECRET_KEY: ci-dummy
    steps:
      - uses: actions/checkout@v4

      # Compose gives the container only its listed variables. Make sure that the account
      # settings from .env reach the padmark service: without accounts, privacy is not checked.
      - name: Check that account settings reach the container
        run: |
          docker compose --env-file /dev/null config --format json > compose-default.json
          jq -e '.services.padmark.environment
            | .PADMARK_ENABLE_ACCOUNTS == "false" and .PADMARK_BOOTSTRAP_TOKEN == null' \
            compose-default.json

          token="ci-dummy-bootstrap-0123456789abcdef"
          printf 'PADMARK_ENABLE_ACCOUNTS=true\nPADMARK_BOOTSTRAP_TOKEN=%s\n' "$token" \
            > "$RUNNER_TEMP/compose.env"
          docker compose --env-file "$RUNNER_TEMP/compose.env" config --format json > compose-env.json
          jq -e --arg token "$token" '.services.padmark.environment
            | .PADMARK_ENABLE_ACCOUNTS == "true" and .PADMARK_BOOTSTRAP_TOKEN == $token' \
            compose-env.json

  ui:
    name: Browser UI tests
    needs: [prepare]
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tests/ui/go.sum

      - name: Install make
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends make

      - run: make test-ui-setup
      - run: make test-ui

      - name: Upload browser report and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-report
          path: tests/ui/artifacts/
          retention-days: 14

  docker:
    name: Docker build & push
    needs: [lint, test, integration, compose, ui]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
